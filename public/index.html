<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment AI - The Art of Emotion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-theme">
    <div class="molding-background"></div>
    <header class="glass-nav">
        <div class="container nav-content">
            <div class="logo">SENTIMENT AI<sup>&reg;</sup></div>
            <nav class="main-nav">
                <a href="#">GALLERY</a>
                <a href="#">ABOUT</a>
                <a href="#">TECH</a>
                <a href="#">CONTACT</a>
            </nav>
            <div class="nav-actions">
                <button class="btn-outline">COLLECTION</button>
            </div>
        </div>
    </header>

    <section class="hero-art">
        <div class="container hero-content">
            <h1 class="serif-title">SENTIMENT CHANGES EVERYTHING. <br><i>EXCEPT TRUTH.</i></h1>
            <p class="hero-subtitle">Every word is a stroke of emotion. Allow our AI to curate the essence of your message.</p>
        </div>
    </section>

    <main class="gallery-container">
        <!-- Input Card -->
        <div class="card input-card">
            <h2>텍스트 입력</h2>
            <textarea id="textInput" placeholder="분석하고 싶은 문장을 입력하세요... (최대 1000자)"></textarea>
            <div class="char-count"><span id="currentCharCount">0</span> / 1000</div>
            <div id="errorContainer" class="error-container"></div>
            <button id="analyzeBtn" class="analyze-btn">감성 분석하기</button>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="card result-card">
            <div class="result-header">
                <div id="sentimentBadge" class="sentiment-badge">POSITIVE</div>
                <div class="confidence-score">신뢰도: <span id="confidenceValue">0</span>%</div>
            </div>
            <div class="reason-box">
                <h3>분석 이유</h3>
                <p id="reasonText"></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Sentiment AI Project. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
