<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment AI - 당신의 문장을 분석합니다</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Sentiment AI</div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>AI가 당신의 문장을 분석합니다</h1>
            <p>텍스트를 입력하면 긍정, 부정, 중립 상태를 신속하게 분석해 드립니다.</p>
        </div>
    </section>

    <main class="container">
        <!-- Input Card -->
        <div class="card input-card">
            <h2>텍스트 입력</h2>
            <textarea id="textInput" placeholder="분석하고 싶은 문장을 입력하세요... (최대 1000자)"></textarea>
            <div class="char-count"><span id="currentCharCount">0</span> / 1000</div>
            <div id="errorContainer" class="error-container"></div>
            <button id="analyzeBtn" class="analyze-btn">감성 분석하기</button>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="card result-card">
            <div class="result-header">
                <div id="sentimentBadge" class="sentiment-badge">POSITIVE</div>
                <div class="confidence-score">신뢰도: <span id="confidenceValue">0</span>%</div>
            </div>
            <div class="reason-box">
                <h3>분석 이유</h3>
                <p id="reasonText"></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Sentiment AI Project. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
